apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: async-api
  template:
    metadata:
      labels:
        app: async-api
    spec:
      containers:
        - name: async-api
          image: async-api:v1
          imagePullPolicy: Never
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: async-api
spec:
  type: NodePort
  selector:
    app: async-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081