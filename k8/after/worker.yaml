apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: worker:v1
          imagePullPolicy: Never
          env:
            - name: GOTENBERG_URL
              value: "http://gotenberg:3000/forms/chromium/convert/html"
            - name: REDIS_ADDR
              value: "redis:6379"